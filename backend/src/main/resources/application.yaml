spring:
  application:
    name: recipes-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  security:
    user:
      name: user
      password: test

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  profiles:
    active: dev

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}